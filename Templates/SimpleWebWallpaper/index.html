<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>WallpaperMac · 简单网页壁纸</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="wallpaper" aria-label="WallpaperMac 简单网页壁纸">
    <div class="glow glow-one" aria-hidden="true"></div>
    <div class="glow glow-two" aria-hidden="true"></div>
    <div class="grid" aria-hidden="true"></div>

    <section class="clock-card">
      <p class="eyebrow">WALLPAPERMAC · LOCAL HTML</p>
      <time id="clock" class="clock" datetime="">00:00:00</time>
      <p id="date" class="date">正在读取日期</p>
      <div class="divider" aria-hidden="true"></div>
      <p class="hint">这是一个可直接导入的网页壁纸模板</p>
      <p id="status" class="status"><span class="status-dot" aria-hidden="true"></span>本地运行中 · 无外部依赖</p>
    </section>

    <footer class="footer">
      <span>WallpaperMac</span>
      <span class="footer-separator" aria-hidden="true">·</span>
      <span>轻量动态背景</span>
    </footer>
  </main>
  <script src="./script.js"></script>
</body>
</html>
