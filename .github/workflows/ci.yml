name: Swift Package CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: wallpapermac-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-core-tests:
    name: Build and core regression tests
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Report Swift toolchain
        run: swift --version

      - name: Validate bundled web wallpaper template
        run: ./scripts/validate-web-wallpaper-template.sh

      - name: Build debug configuration
        run: swift build

      - name: Run core regression tests
        run: swift run WallpaperMacCoreTests

      - name: Check whitespace errors
        run: git diff --check HEAD^
